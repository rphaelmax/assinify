<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assinify — Criar conta</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <meta name="theme-color" content="#2563EB" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/tema.js"></script>
</head>

<body>

  <div class="auth-wrapper" style="position:relative;">
    <div class="auth-panel-form">
      <button class="btn-tema" id="btn-tema" onclick="alternarTema()" aria-label="Alternar tema"
        style="position:absolute;top:16px;right:16px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      </button>
      <div class="auth-logo">Assin<span>ify</span></div>

      <form class="auth-form" onsubmit="registrar(event)">
        <div class="auth-title">Criar sua conta</div>
        <div class="auth-subtitle">Leva menos de um minuto.</div>

        <div class="auth-error" id="auth-error"></div>

        <div class="form-group">
          <label class="form-label">Nome</label>
          <input class="form-input" type="text" id="input-nome" placeholder="Seu nome" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input class="form-input" type="email" id="input-email" placeholder="voce@email.com" autocomplete="email"
            required />
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input class="form-input" type="password" id="input-senha" placeholder="••••••••" autocomplete="new-password"
            required oninput="onSenhaRegistroInput()" />
          <div class="senha-forca" id="senha-forca-registro" style="display:none;">
            <div class="senha-forca-bar">
              <div class="senha-forca-fill" id="senha-forca-registro-fill"></div>
            </div>
            <span class="senha-forca-text" id="senha-forca-registro-text"></span>
          </div>
          <div class="senha-dica" id="senha-dica"
            style="font-size:11px;color:var(--text-muted);margin-top:6px;display:none;"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar senha</label>
          <input class="form-input" type="password" id="input-confirmar-senha" placeholder="••••••••"
            autocomplete="new-password" required />
        </div>

        <button class="btn-auth-submit" type="submit" id="btn-submit">Criar conta</button>

        <div class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></div>
      </form>
    </div>

    <div class="auth-panel-brand">
      <div class="auth-brand-headline">Cada assinatura, num só lugar, sob controle.</div>
      <div class="auth-brand-sub">Cadastre suas assinaturas em segundos e nunca mais seja pego de surpresa por uma
        renovação.</div>

      <div class="auth-preview-card" aria-label="Prévia do dashboard">
        <div class="auth-preview-label">Gasto mensal estimado</div>
        <div class="auth-preview-value">R$ 74,70</div>
        <div class="auth-preview-items"></div>
        <div class="auth-preview-footer">Assinaturas ativas • atualizado agora</div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/forca-senha.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/auth-preview.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js').catch(() => { });
    }
  </script>
</body>

</html>
